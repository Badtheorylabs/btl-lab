name: Verify portable stack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installed-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: btl-lab
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Checkout the pinned sibling packages
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, tomllib
          config = tomllib.loads(pathlib.Path('btl-lab/pyproject.toml').read_text())
          for dependency in config['project']['dependencies']:
              match = re.fullmatch(r'(btl-[a-z]+) @ git\+(https://github.com/Badtheorylabs/[^@]+)@([a-f0-9]{40})', dependency)
              if match is None:
                  raise ValueError('Every sibling dependency must have a full commit pin')
              name, repository, revision = match.groups()
              subprocess.run(['git', 'clone', '--no-checkout', repository, name], check=True)
              subprocess.run(['git', '-C', name, 'checkout', '--detach', revision], check=True)
          PY
      - name: Install control test dependencies
        run: |
          python -m pip install setuptools wheel pytest numpy
          python -m pip install --no-deps -e btl-lab -e btl-rl -e btl-train -e btl-measure -e btl-kernels
      - name: Check control contracts
        run: python -m pytest -q btl-lab/tests btl-rl/tests
      - name: Build wheels and exercise the installed workflow
        run: python btl-lab/tools/verify_install.py
